
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Flexbox</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    padding: 20px;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding: 20px;
    background: #222;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}

main {
    margin-top: 40px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

.card {
    flex: 1 1 250px;
    background: #333;
    padding: 30px;
    border-radius: 12px;
}

@media (max-width: 600px) {
    .navbar {
        flex-direction: column;
        align-items: flex-start;
    }

    nav {
        flex-direction: column;
        gap: 10px;
    }
}

    </style>
</head>
<body>

    <header class="navbar">
        <h1>Divyansh</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h2>My Projects</h2>

        <section class="container">
            <article class="card">
                <h3>Portfolio Website</h3>
                <p>Personal portfolio using HTML and CSS.</p>
            </article>

            <article class="card">
                <h3>Restaurant Website</h3>
                <p>A modern restaurant menu design.</p>
            </article>

            <article class="card">
                <h3>AI Project</h3>
                <p>Exploring artificial intelligence.</p>
            </article>
        </section>
    </main>

</body>
</html>
