
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Design System</title>
    <style>

:root {
    --primary-color: #d4af37;
    --background-color: #111111;
    --card-color: #222222;
    --text-color: #ffffff;
    --secondary-text: #aaaaaa;

    --small-size: 14px;
    --normal-size: 18px;
    --heading-size: 32px;

    --spacing: 20px;
    --radius: 12px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--background-color);
    color: var(--text-color);
    font-family: Arial, sans-serif;
    line-height: 1.6;
}

header {
    padding: 30px;
    text-align: center;
}

h1 {
    color: var(--primary-color);
    font-size: var(--heading-size);
}

p {
    color: var(--secondary-text);
    font-size: var(--normal-size);
}

.card {
    background: var(--card-color);
    margin: 30px auto;
    padding: var(--spacing);
    max-width: 500px;
    border-radius: var(--radius);
}

button {
    background: var(--primary-color);
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    margin-top: 15px;
    cursor: pointer;
}

    </style>
</head>
<body>

    <header>
        <h1>Divyansh Raturi</h1>
        <p>My Personal Design System</p>
    </header>

    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>I am learning CSS design tokens and typography.</p>
            <button>Explore More</button>
        </section>
    </main>

</body>
</html>
