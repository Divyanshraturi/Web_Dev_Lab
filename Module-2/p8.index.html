
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #222;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

main section {
    padding: 60px 30px;
    min-height: 300px;
}

.card {
    position: relative;
    width: 350px;
    overflow: hidden;
    border-radius: 12px;
}

.card img {
    width: 100%;
    display: block;
}

.overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px;
    background: rgba(0, 0, 0, 0.75);
}

    </style>
</head>
<body>

    <nav class="navbar">
        <h2>My Portfolio</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </div>
    </nav>

    <main>
        <section id="home">
            <h1>Welcome to My Portfolio</h1>
            <p>Scroll down to test the sticky navbar.</p>
        </section>

        <section class="projects" id="projects">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=600"
                     alt="Laptop on a desk">
                <div class="overlay">
                    <h2>Web Development</h2>
                    <p>My first portfolio project.</p>
                </div>
            </div>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>I enjoy building websites.</p>
        </section>
    </main>

</body>
</html>
